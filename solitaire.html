<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solitaire — A Gentle Game</title>
<style>
  :root {
    --bg-1: #efe3cf;
    --bg-2: #d9c6a3;
    --felt-1: #3a9163;
    --felt-2: #1f5c3d;
    --felt-edge: #163f2a;
    --card-back-1: #4a6fa5;
    --card-back-2: #2f4d7a;
    --card-face-1: #ffffff;
    --card-face-2: #eef1f6;
    --accent: #2e7d32;
    --accent-dark: #245e27;
    --text: #22303c;
    --red: #b8272c;
    --black: #1b2430;
    --slot-border: #ffffff99;
    --gold: #ffb300;

    --card-w: clamp(60px, 8.4vw, 124px);
    --card-h: clamp(86px, 12vw, 176px);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #fffaf0 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    font-family: "Segoe UI", Verdana, Arial, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 60px;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.8rem, 3.2vw, 2.6rem);
    margin: 4px 0 4px;
    text-align: center;
    text-shadow: 0 2px 3px rgba(0,0,0,0.15);
  }

  p.subtitle {
    font-size: 1.25rem;
    margin: 0 0 16px;
    text-align: center;
    max-width: 650px;
  }

  .status-bar {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 16px;
  }

  .status-bar span {
    background: #ffffff;
    padding: 8px 18px;
    border-radius: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }

  .controls {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
  }

  button.action {
    font-size: 1.15rem;
    padding: 12px 22px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: white;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.25);
  }

  button.action:hover { filter: brightness(1.08); }
  button.action:disabled { background: #9aa79a; cursor: default; filter: none; }
  button.action:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

  #message {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--accent-dark);
    text-align: center;
    min-height: 2rem;
    margin-bottom: 10px;
  }

  #table {
    background:
      radial-gradient(ellipse at 50% 35%, var(--felt-1) 0%, var(--felt-2) 75%, var(--felt-edge) 100%);
    border-radius: 24px;
    padding: clamp(14px, 2.2vw, 30px);
    box-shadow:
      inset 0 0 0 6px rgba(255,255,255,0.06),
      inset 0 2px 18px rgba(0,0,0,0.35),
      0 10px 26px rgba(0,0,0,0.35);
    width: 100%;
    max-width: 1220px;
  }

  .top-row {
    display: flex;
    gap: clamp(8px, 1.4vw, 16px);
    margin-bottom: clamp(20px, 3vw, 34px);
    flex-wrap: wrap;
  }

  .top-row .spacer { flex: 1 1 auto; min-width: 14px; }

  .pile-slot {
    width: var(--card-w);
    height: var(--card-h);
    border: 3px dashed var(--slot-border);
    border-radius: 12px;
    background: rgba(0,0,0,0.08);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
    position: relative;
    flex: 0 0 auto;
  }

  .foundation-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.6rem, 2.6vw, 2.4rem);
    color: var(--slot-border);
    pointer-events: none;
  }

  .recycle-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.6rem, 2.6vw, 2.4rem);
    color: white;
    cursor: pointer;
  }

  .recycle-hint:focus-visible {
    outline: 4px solid var(--gold);
    outline-offset: 2px;
    border-radius: 12px;
  }

  .card {
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 12px;
    background: linear-gradient(160deg, var(--card-face-1) 0%, var(--card-face-2) 100%);
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 3px 3px rgba(0,0,0,0.15), 0 6px 10px rgba(0,0,0,0.3);
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(4px, 0.8vw, 8px) clamp(5px, 1vw, 9px);
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .card:focus-visible {
    outline: 4px solid var(--gold);
    outline-offset: 2px;
  }

  .card.red { color: var(--red); }
  .card.black { color: var(--black); }

  .card .corner { font-size: clamp(0.85rem, 1.5vw, 1.4rem); line-height: 1; }
  .card .corner.bottom { align-self: flex-end; transform: rotate(180deg); }
  .card .center-suit {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.5rem, 3vw, 2.6rem);
    opacity: 0.8;
  }

  .card.face-down {
    background: linear-gradient(160deg, var(--card-back-1) 0%, var(--card-back-2) 100%);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.07) 0, rgba(255,255,255,0.07) 6px, transparent 6px, transparent 14px),
      linear-gradient(160deg, var(--card-back-1) 0%, var(--card-back-2) 100%);
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer;
  }

  .card.face-down::after {
    content: "";
    position: absolute;
    inset: 12%;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 8px;
  }

  .card.selected {
    box-shadow: 0 0 0 4px var(--gold), 0 5px 10px rgba(0,0,0,0.4);
    transform: translateY(-6px);
  }

  .tableau-row {
    display: flex;
    justify-content: space-between;
    gap: clamp(6px, 1.4vw, 16px);
  }

  .tableau-col {
    width: var(--card-w);
    min-height: var(--card-h);
    position: relative;
    flex: 0 0 auto;
  }

  .empty-col-hint {
    width: var(--card-w);
    height: var(--card-h);
    border: 3px dashed var(--slot-border);
    border-radius: 12px;
    background: rgba(0,0,0,0.08);
    position: absolute;
    top: 0; left: 0;
  }

  @media (max-width: 480px) {
    :root {
      --card-w: clamp(34px, 11vw, 56px);
      --card-h: clamp(48px, 15.6vw, 80px);
    }
    .top-row { gap: 4px; }
    .tableau-row { gap: 4px; }
    #table { padding: 8px; overflow-x: auto; }
  }
</style>
</head>
<body>

<h1>🂡 Solitaire 🂭</h1>
<p class="subtitle">Click a card to pick it up, then click where you'd like to put it. Double-click a card to send it home automatically.</p>

<div class="status-bar">
  <span>Moves: <span id="moves">0</span></span>
  <span>In foundations: <span id="homeCount">0</span> / 52</span>
</div>

<div class="controls">
  <button class="action" id="drawBtn">Draw Card</button>
  <button class="action" id="undoBtn" disabled>Undo</button>
  <button class="action" id="autoBtn" disabled>Auto-Finish</button>
  <button class="action" id="newGameBtn">New Game</button>
</div>

<p style="font-size:1.1rem; margin:-6px 0 12px;"><a href="index.html" style="color:var(--accent);">← Back to Memory Match</a></p>

<div id="message" role="status" aria-live="polite"></div>

<div id="table">
  <div class="top-row">
    <div class="pile-slot" id="stockSlot"></div>
    <div class="pile-slot" id="wasteSlot"></div>
    <div class="spacer"></div>
    <div class="pile-slot" id="foundation-S"><div class="foundation-icon">♠</div></div>
    <div class="pile-slot" id="foundation-H"><div class="foundation-icon">♥</div></div>
    <div class="pile-slot" id="foundation-D"><div class="foundation-icon">♦</div></div>
    <div class="pile-slot" id="foundation-C"><div class="foundation-icon">♣</div></div>
  </div>
  <div class="tableau-row" id="tableauRow"></div>
</div>

<script>
  const SUITS = ["S", "H", "D", "C"];
  const SUIT_SYMBOL = { S: "♠", H: "♥", D: "♦", C: "♣" };
  const SUIT_COLOR = { S: "black", H: "red", D: "red", C: "black" };
  const RANK_LABEL = { 1: "A", 11: "J", 12: "Q", 13: "K" };

  function getCardHeight() {
    const probe = document.createElement("div");
    probe.className = "card";
    probe.style.visibility = "hidden";
    probe.style.position = "fixed";
    document.body.appendChild(probe);
    const h = probe.offsetHeight;
    probe.remove();
    return h;
  }

  let stock = [];
  let waste = [];
  let foundations = { S: [], H: [], D: [], C: [] };
  let tableau = [[], [], [], [], [], [], []];
  let selection = null; // { source: 'waste'|'tableau', col: n, index: n }
  let moves = 0;
  let history = [];

  let audioCtx = null;
  function playTone(freq, duration = 0.15) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* ignore */ }
  }

  function freshDeck() {
    const deck = [];
    for (const suit of SUITS) {
      for (let rank = 1; rank <= 13; rank++) {
        deck.push({ suit, rank, faceUp: false });
      }
    }
    return deck;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function snapshot() {
    return JSON.stringify({ stock, waste, foundations, tableau, moves });
  }

  function pushHistory() {
    history.push(snapshot());
    if (history.length > 100) history.shift();
    document.getElementById("undoBtn").disabled = false;
  }

  function undo() {
    if (!history.length) return;
    const state = JSON.parse(history.pop());
    stock = state.stock;
    waste = state.waste;
    foundations = state.foundations;
    tableau = state.tableau;
    moves = state.moves;
    selection = null;
    document.getElementById("undoBtn").disabled = history.length === 0;
    render();
  }

  function newGame() {
    const deck = shuffle(freshDeck());
    tableau = [[], [], [], [], [], [], []];
    for (let col = 0; col < 7; col++) {
      for (let i = 0; i <= col; i++) {
        const card = deck.pop();
        card.faceUp = i === col;
        tableau[col].push(card);
      }
    }
    stock = deck.map(c => ({ ...c, faceUp: false }));
    waste = [];
    foundations = { S: [], H: [], D: [], C: [] };
    selection = null;
    moves = 0;
    history = [];
    document.getElementById("undoBtn").disabled = true;
    document.getElementById("message").textContent = "";
    render();
  }

  function totalHome() {
    return foundations.S.length + foundations.H.length + foundations.D.length + foundations.C.length;
  }

  function canPlaceOnTableau(movingBottomCard, destCol) {
    const dest = tableau[destCol];
    if (dest.length === 0) return movingBottomCard.rank === 13;
    const top = dest[dest.length - 1];
    if (!top.faceUp) return false;
    return SUIT_COLOR[top.suit] !== SUIT_COLOR[movingBottomCard.suit] && top.rank === movingBottomCard.rank + 1;
  }

  function canPlaceOnFoundation(card, suit) {
    const pile = foundations[suit];
    if (card.suit !== suit) return false;
    const nextRank = pile.length + 1;
    return card.rank === nextRank;
  }

  function clearSelection() {
    selection = null;
    render();
  }

  function drawFromStock() {
    if (stock.length === 0) {
      if (waste.length === 0) return;
      stock = waste.reverse().map(c => ({ ...c, faceUp: false }));
      waste = [];
      moves++;
      render();
      return;
    }
    pushHistory();
    const card = stock.pop();
    card.faceUp = true;
    waste.push(card);
    moves++;
    selection = null;
    playTone(500, 0.08);
    render();
  }

  function tryAutoToFoundation(card, source) {
    for (const suit of SUITS) {
      if (canPlaceOnFoundation(card, suit)) {
        pushHistory();
        removeCardFromSource(source);
        foundations[suit].push(card);
        moves++;
        selection = null;
        playTone(750, 0.2);
        finishMove();
        return true;
      }
    }
    return false;
  }

  function removeCardFromSource(source) {
    if (source.source === "waste") {
      waste.pop();
    } else if (source.source === "tableau") {
      tableau[source.col].splice(source.index);
    }
  }

  function getMovingGroup(source) {
    if (source.source === "waste") {
      return waste.length ? [waste[waste.length - 1]] : [];
    }
    if (source.source === "tableau") {
      return tableau[source.col].slice(source.index);
    }
    return [];
  }

  function finishMove() {
    if (selection && selection.source === "tableau") {
      const col = tableau[selection.col];
      if (col.length && !col[col.length - 1].faceUp) {
        col[col.length - 1].faceUp = true;
        playTone(600, 0.12);
      }
    }
    checkWin();
    render();
  }

  function attemptMoveToTableau(destCol) {
    const group = getMovingGroup(selection);
    if (!group.length) return false;
    const bottomCard = group[0];
    if (!canPlaceOnTableau(bottomCard, destCol)) return false;
    if (selection.source === "tableau" && selection.col === destCol) return false;
    pushHistory();
    removeCardFromSource(selection);
    tableau[destCol].push(...group);
    moves++;
    selection = null;
    playTone(500, 0.1);
    finishMove();
    return true;
  }

  function attemptMoveToFoundation(suit) {
    const group = getMovingGroup(selection);
    if (group.length !== 1) return false;
    const card = group[0];
    if (!canPlaceOnFoundation(card, suit)) return false;
    pushHistory();
    removeCardFromSource(selection);
    foundations[suit].push(card);
    moves++;
    selection = null;
    playTone(750, 0.2);
    finishMove();
    return true;
  }

  function checkWin() {
    if (totalHome() === 52) {
      document.getElementById("message").textContent = `🎉 You won in ${moves} moves! Wonderful! 🎉`;
      playTone(880, 0.3);
      setTimeout(() => playTone(1100, 0.3), 250);
      setTimeout(() => playTone(1320, 0.35), 500);
    }
  }

  function canAutoFinish() {
    return tableau.every(col => col.every(c => c.faceUp));
  }

  function autoFinish() {
    if (!canAutoFinish()) return;
    pushHistory();
    let progressed = true;
    let guard = 0;
    while (progressed && guard < 500) {
      progressed = false;
      guard++;
      for (const suit of SUITS) {
        for (let col = 0; col < 7; col++) {
          const pile = tableau[col];
          if (pile.length && canPlaceOnFoundation(pile[pile.length - 1], suit)) {
            foundations[suit].push(pile.pop());
            progressed = true;
          }
        }
        if (waste.length && canPlaceOnFoundation(waste[waste.length - 1], suit)) {
          foundations[suit].push(waste.pop());
          progressed = true;
        }
      }
    }
    selection = null;
    playTone(900, 0.25);
    checkWin();
    render();
  }

  function onCardClick(source, evt) {
    evt.stopPropagation();
    const group = getMovingGroup(source);
    if (!group.length) return;
    const clickedCard = source.source === "waste" ? waste[waste.length - 1] : tableau[source.col][source.index];
    if (!clickedCard.faceUp) return;

    const isSameSelection = selection && selection.source === source.source && selection.col === source.col && selection.index === source.index;

    if (selection && !isSameSelection && source.source === "tableau") {
      // Clicking the top card of another column is how you complete a move there,
      // since a non-empty column has no empty space left to click on.
      if (attemptMoveToTableau(source.col)) return;
    }

    if (isSameSelection) {
      clearSelection();
      return;
    }
    selection = { source: source.source, col: source.col, index: source.index };
    render();
  }

  function onCardDoubleClick(source, evt) {
    evt.stopPropagation();
    const group = getMovingGroup(source);
    if (group.length !== 1) return;
    selection = { source: source.source, col: source.col, index: source.index };
    tryAutoToFoundation(group[0], selection);
  }

  function onTableauColClick(col) {
    if (!selection) return;
    attemptMoveToTableau(col);
  }

  function onFoundationClick(suit) {
    if (!selection) return;
    attemptMoveToFoundation(suit);
  }

  function makeCardEl(card, source, isTopInteractive) {
    const el = document.createElement("div");
    el.className = "card " + (card.faceUp ? SUIT_COLOR[card.suit] : "face-down");
    el.tabIndex = 0;
    if (card.faceUp) {
      const label = RANK_LABEL[card.rank] || card.rank;
      el.innerHTML = `
        <div class="corner top">${label}${SUIT_SYMBOL[card.suit]}</div>
        <div class="center-suit">${SUIT_SYMBOL[card.suit]}</div>
        <div class="corner bottom">${label}${SUIT_SYMBOL[card.suit]}</div>
      `;
      el.setAttribute("aria-label", `${label} of ${card.suit}`);
      if (source && isTopInteractive) {
        el.addEventListener("click", (e) => onCardClick(source, e));
        el.addEventListener("dblclick", (e) => onCardDoubleClick(source, e));
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onCardClick(source, e); }
        });
      }
      if (selection && source && selection.source === source.source) {
        if (source.source === "waste") {
          el.classList.add("selected");
        } else if (source.source === "tableau" && selection.col === source.col && selection.index <= source.index) {
          el.classList.add("selected");
        }
      }
    } else {
      el.setAttribute("aria-label", "Face-down card");
      if (source && source.source === "stock") {
        el.addEventListener("click", drawFromStock);
      }
    }
    return el;
  }

  function render() {
    document.getElementById("moves").textContent = moves;
    document.getElementById("homeCount").textContent = totalHome();
    document.getElementById("undoBtn").disabled = history.length === 0;
    document.getElementById("autoBtn").disabled = !canAutoFinish() || totalHome() === 52;

    const stockSlot = document.getElementById("stockSlot");
    stockSlot.innerHTML = "";
    if (stock.length) {
      const el = makeCardEl({ faceUp: false }, { source: "stock" }, true);
      stockSlot.appendChild(el);
    } else if (waste.length) {
      const hint = document.createElement("div");
      hint.className = "recycle-hint";
      hint.textContent = "↺";
      hint.tabIndex = 0;
      hint.setAttribute("role", "button");
      hint.setAttribute("aria-label", "Reshuffle waste pile back into the stock");
      hint.addEventListener("click", drawFromStock);
      hint.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); drawFromStock(); }
      });
      stockSlot.appendChild(hint);
    }

    const wasteSlot = document.getElementById("wasteSlot");
    wasteSlot.innerHTML = "";
    wasteSlot.onclick = null;
    if (waste.length) {
      const topCard = waste[waste.length - 1];
      const el = makeCardEl(topCard, { source: "waste" }, true);
      wasteSlot.appendChild(el);
    }

    for (const suit of SUITS) {
      const slot = document.getElementById("foundation-" + suit);
      const existingCard = slot.querySelector(".card");
      if (existingCard) existingCard.remove();
      slot.onclick = () => onFoundationClick(suit);
      const pile = foundations[suit];
      if (pile.length) {
        const topCard = pile[pile.length - 1];
        const el = makeCardEl(topCard, null, false);
        slot.appendChild(el);
      }
    }

    const cardH = getCardHeight();
    const faceUpOffset = cardH * 0.21;
    const faceDownOffset = cardH * 0.1;

    const tableauRow = document.getElementById("tableauRow");
    tableauRow.innerHTML = "";
    tableau.forEach((colCards, colIdx) => {
      const colEl = document.createElement("div");
      colEl.className = "tableau-col";
      colEl.addEventListener("click", () => onTableauColClick(colIdx));

      if (colCards.length === 0) {
        const hint = document.createElement("div");
        hint.className = "empty-col-hint";
        colEl.appendChild(hint);
      }

      let offset = 0;
      colCards.forEach((card, idx) => {
        const el = makeCardEl(card, { source: "tableau", col: colIdx, index: idx }, card.faceUp);
        el.style.top = offset + "px";
        colEl.appendChild(el);
        offset += card.faceUp ? faceUpOffset : faceDownOffset;
      });
      colEl.style.minHeight = (Math.max(cardH, offset + cardH - faceUpOffset)) + "px";

      tableauRow.appendChild(colEl);
    });
  }

  document.getElementById("drawBtn").addEventListener("click", drawFromStock);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("autoBtn").addEventListener("click", autoFinish);
  document.getElementById("newGameBtn").addEventListener("click", newGame);
  document.getElementById("table").addEventListener("click", () => {});

  newGame();
</script>

</body>
</html>
